[package]
name = "multiogarii"
version = "2.0.0"
edition = "2021"
rust-version = "1.88"
description = "Open source multi-protocol Ogar server (agar.io clone), rewritten in Rust"
license = "Apache-2.0"
repository = "https://github.com/IloveAgariouwu/MultiOgarII"

[lib]
path = "src/lib.rs"

[[bin]]
name = "multiogarii"
path = "src/main.rs"

[features]
default = ["tls"]
tls = ["dep:tokio-rustls", "dep:rustls-pemfile"]

[dependencies]
bytes = "1"
rand = { version = "0.8", default-features = false, features = ["small_rng"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["sync"] }
toml = "0.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
mimalloc = { version = "0.1", default-features = false }
rand = { version = "0.8", features = ["small_rng"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rustls-pemfile = { version = "2", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
