[workspace]
members = ["core", "web"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
miniz_oxide = "0.9"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3
