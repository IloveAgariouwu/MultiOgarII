<!doctype html>
<html lang="zh-Hant">
    <head>
        <title>MultiOgarII</title>
        <link rel="icon" type="image/png" href="./favicon.png" />
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
        />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <script>
            var gMobile =
                /[?&]mobile=1/.test(location.search) ||
                (navigator.userAgentData ? navigator.userAgentData.mobile : /Mobi/.test(navigator.userAgent));
            gMobile && document.documentElement.classList.add("mobile");
        </script>
        <script type="module" src="/src/main.ts"></script>
        <style>
            #boot {
                position: fixed;
                inset: 0;
                z-index: 1000;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 2rem;
                background: #141414;
                color: #f2f2f2;
                font:
                    500 14px/1.4 "Overpass",
                    system-ui,
                    sans-serif;
                transition: opacity 0.4s;
            }
            #boot.done {
                opacity: 0;
                pointer-events: none;
            }
            #boot-title {
                font-size: 48px;
                font-weight: 800;
                line-height: 1;
                letter-spacing: 0.06em;
                opacity: 0;
                transition: opacity 0.3s;
            }
            #boot-title.ready {
                opacity: 1;
            }
            #boot-track {
                width: min(18rem, 60vw);
                height: 2px;
                background: color-mix(in srgb, #f2f2f2 18%, transparent);
            }
            #boot-bar {
                width: 0;
                height: 100%;
                background: #f2f2f2;
                transition: width 0.3s;
            }
            #boot-status {
                min-height: 1.4em;
                color: color-mix(in srgb, #f2f2f2 65%, #141414);
                font-size: 13px;
                text-align: center;
            }
            #boot.failed #boot-status {
                color: #f2f2f2;
            }
        </style>
    </head>
    <body>
        <div id="boot">
            <div id="boot-title">MultiOgarII</div>
            <div id="boot-track"><div id="boot-bar"></div></div>
            <div id="boot-status"></div>
        </div>
    </body>
</html>
